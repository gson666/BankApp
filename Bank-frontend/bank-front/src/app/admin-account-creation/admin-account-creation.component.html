<!-- src/app/admin-account-creation/admin-account-creation.component.html -->
<div>
    <h2>Create Account</h2>
    <form (ngSubmit)="createAccount()">
      <label for="name">Account Name:</label>
      <input type="text" id="name" [(ngModel)]="account.name" name="name" required>
  
      <label for="balance">Initial Balance:</label>
      <input type="number" id="balance" [(ngModel)]="account.currentBalance" name="balance" required>
  
      <label for="userId">User ID:</label>
      <input type="text" id="userId" [(ngModel)]="account.userId" name="userId" required>
  
      <button type="submit">Create Account</button>
    </form>
  </div>
